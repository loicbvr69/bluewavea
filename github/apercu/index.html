<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>BlueWavea — Aperçus</title>
<!-- (06/11/2026) Page « Aperçus » demandée par Loïc : tous les projets réunis, en utilisation seule (aucune édition).
     Applications PC / mobile = copie de TEST (apercu/pc, apercu/mobile) : la version à valider avant publication dans
     github/pc et github/mobile ; Hélios = github/helios. Vrai cloud. -->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #F6F7F9; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #14265C; }
  body { display: flex; height: 100vh; overflow: hidden; }
  nav { width: 232px; flex-shrink: 0; background: #14265C; color: #fff; display: flex; flex-direction: column; padding: 18px 12px; gap: 4px; overflow-y: auto; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  .marque { font-weight: 800; font-size: 17px; padding: 0 10px 2px; }
  .sous { font-size: 11.5px; color: #9CC8EC; padding: 0 10px 14px; }
  .titre { font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #9CC8EC; padding: 12px 10px 4px; }
  button { all: unset; cursor: pointer; display: block; padding: 10px 12px; border-radius: 10px; font-size: 14px; font-weight: 600; color: #fff; }
  button:hover { background: rgba(255,255,255,.08); }
  button[aria-current="true"] { background: #2F7DD1; }
  main { flex: 1; min-width: 0; display: flex; align-items: stretch; justify-content: center; background: #F6F7F9; position: relative; }
  #papier { position: absolute; inset: 0; z-index: 5; overflow-y: auto; background: #3A4766; display: none; scrollbar-width: none; }
  #papier::-webkit-scrollbar { display: none; }
  iframe { border: 0; width: 100%; height: 100%; background: #fff; }
  main.tel { align-items: center; background: #C9D6E3; }
  main.tel iframe { width: 430px; max-width: 100%; height: min(932px, 100%); border-radius: 22px; box-shadow: 0 20px 50px rgba(20,38,92,.25); }
  @media (max-width: 760px) {
    body { flex-direction: column; }
    nav { width: auto; flex-direction: row; flex-wrap: nowrap; overflow-x: auto; padding: 8px; gap: 4px; }
    .marque, .sous, .titre { display: none; }
    button { white-space: nowrap; padding: 8px 10px; font-size: 13px; }
    main.tel iframe { width: 100%; height: 100%; border-radius: 0; box-shadow: none; }
  }
</style>
</head>
<body>
<nav aria-label="Projets">
  <div class="marque">BlueWavea</div>
  <div class="sous">Aperçus — utilisation seule</div>
  <div class="titre">Applications</div>
  <button data-src="../pc/" data-tel="0">💻 Application PC</button>
  <button data-src="../mobile/" data-tel="1">📱 Application mobile</button>
  <button data-src="../helios/index.html" data-tel="0">✨ H.É.L.I.O.S.</button>
  <div class="titre">Site et documents</div>
  <button data-src="site.dc.html" data-tel="0">🌐 Site (maquette)</button>
  <button data-src="espace-client.dc.html" data-tel="0">👤 Espace client</button>
  <button data-src="contrat.dc.html" data-tel="0">✍️ Contrat (modèle)</button>
  <div class="titre">Documents — vrais, sur papier</div>
  <button data-src="../pc/" data-tel="0" data-doc="facture">🧾 Facture</button>
  <button data-src="../pc/" data-tel="0" data-doc="devis">📝 Devis</button>
  <button data-src="../pc/" data-tel="0" data-doc="cr">📋 Compte Rendu</button>
  <button data-src="../pc/" data-tel="0" data-doc="crclient">📨 Compte rendu client</button>
  <button data-src="../pc/" data-tel="0" data-doc="bilan">📊 Bilan comptable</button>
  <div class="titre">Print</div>
  <button data-src="flyer.dc.html" data-tel="0">📄 Flyer</button>
  <button data-src="carte-de-visite.html" data-tel="0">🪪 Carte de visite</button>
</nav>
<main id="zone"><iframe id="vue" title="Aperçu" allow="microphone; geolocation; clipboard-write"></iframe><div id="papier"></div><iframe id="docapp" title="" aria-hidden="true" tabindex="-1" style="position:absolute;left:-12000px;top:0;width:1280px;height:900px;border:0;pointer-events:none"></iframe></main>
<script>
  (function () {
    var boutons = document.querySelectorAll('nav button'), vue = document.getElementById('vue'), zone = document.getElementById('zone');
    /* (12/11/2026) « des visuels uniques, papier, pas la page de l'application » : les VRAIS documents (dernière facture,
       dernier devis, dernier compte rendu, bilan) seuls, sur une feuille blanche. L'application PC est chargée derrière, en
       lecture seule (vrai cloud, rien n'est enregistré ni envoyé) ; le document est recopié depuis elle. */
    /* (12/11/2026) « ça met du temps à venir et je vois une feuille vide » : les documents ont leur PROPRE application cachée
       (#docapp), préchargée en arrière-plan dès l'ouverture de la page et jamais remplacée par les autres aperçus ; le
       document n'est recopié qu'une fois l'application entièrement prête (fin de l'écran de démarrage). */
    var papier = document.getElementById('papier'), app = document.getElementById('docapp'), tour = 0;
    /* (13/11/2026) l'application cachée relit le cloud même quand la page n'est pas au premier plan (sinon : « je vois rien ») */
    app.addEventListener('load', function () { try { Object.defineProperty(app.contentWindow.document, 'hidden', { configurable: true, get: function () { return false; } }); } catch (e) {} });
    function chargerApp() { if (!app.getAttribute('src')) app.src = '../pc/#papier'; }
    setTimeout(chargerApp, 1200);
    var attendre = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
    function logique() {
      try {
        var D = app.contentWindow.document, els = D.querySelectorAll('*');
        for (var i = 0; i < els.length; i++) {
          var k = Object.keys(els[i]).find(function (x) { return x.indexOf('__react') === 0; }); if (!k) continue;
          var f = els[i][k], n = 0;
          while (f && n < 200) { var s = f.stateNode; if (s && s.logic && s.logic.piecesRdv) return s.logic; f = f.return; n++; }
        }
      } catch (e) {}
      return null;
    }
    function cadre(titre, html) {
      papier.innerHTML = '<div style="min-height:100%;box-sizing:border-box;padding:0 24px 32px;display:flex;flex-direction:column;align-items:center">' +
        '<div style="position:sticky;top:0;z-index:2;width:100%;display:flex;justify-content:center;padding:16px 0 18px;background:linear-gradient(#3A4766 75%,rgba(58,71,102,0))">' +
        '<div style="width:100%;max-width:680px;box-sizing:border-box;background:#14265C;color:#fff;padding:13px 18px;border-radius:12px;font-weight:800;font-size:16px;box-shadow:0 4px 14px rgba(0,0,0,.25)">' + titre + '</div></div>' + html + '</div>';
      papier.style.display = 'block'; papier.scrollTop = 0;
    }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
    /* (13/11/2026) « tous les onglets doivent s'ouvrir en moins d'une seconde » : pauses sans minuterie (les minuteries sont
       ralenties à 1 s quand la page n'est pas au premier plan) et documents préparés à l'avance, dès que l'application cachée
       est prête : un clic affiche la feuille déjà fabriquée, puis la remet à jour en arrière-plan. */
    var pause = function () { return new Promise(function (ok) { var c = new MessageChannel(); c.port1.onmessage = function () { ok(); }; c.port2.postMessage(0); }); };
    var guetter = async function (f, max) { var t0 = Date.now(); while (Date.now() - t0 < (max || 3000)) { var x = f(); if (x) return x; await pause(); } return null; };
    /* compte rendu complet : copie figée (valeurs des champs comprises) de l'écran du RDV et de chacun de ses onglets */
    async function crComplet(L, W, r, avec) {
      var D = W.document, box = D.createElement('div');
      var figer = function (src) {
        var cl = src.cloneNode(true), a = src.querySelectorAll('input,textarea,select'), b = cl.querySelectorAll('input,textarea,select');
        [].forEach.call(a, function (e, i) {
          var c = b[i]; if (!c) return;
          if (e.type === 'checkbox' || e.type === 'radio') { if (e.checked) c.setAttribute('checked', ''); else c.removeAttribute('checked'); return; }
          var v = e.tagName === 'SELECT' ? ((e.options[e.selectedIndex] || {}).text || '') : (e.value || '—');
          var s = D.createElement('div'); s.textContent = v;
          s.style.cssText = 'padding:9px 12px;border:1px solid #DCE8F2;border-radius:9px;font-size:13px;color:#14265C;background:#F7FAFD;white-space:pre-wrap;min-height:18px';
          c.replaceWith(s);
        });
        /* le mode de règlement choisi (bouton foncé) reste visible en pastille ; les autres boutons disparaissent */
        [].forEach.call(cl.querySelectorAll('button'), function (n) {
          if (/^(💵 Espèces|🏦 Virement|📄 Chèque|💳 Carte)$/.test(n.textContent.trim()) && /20, 38, 92|#14265C/i.test(n.getAttribute('style') || '')) {
            var p = D.createElement('span'); p.textContent = n.textContent.trim();
            p.style.cssText = 'display:inline-block;background:#14265C;color:#fff;font-size:13px;font-weight:800;border-radius:99px;padding:7px 14px';
            n.replaceWith(p);
          }
        });
        [].forEach.call(cl.querySelectorAll('button,[data-bw-interne],input[type=file]'), function (n) { n.remove(); });
        return cl;
      };
      var ecran = function () { return D.querySelector('[data-screen-label="Comptes rendus"]'); };
      L.setState(avec({ screen: 'comptesrendus', crApercuId: r.id, crPanelOuvert: false, crSousOnglet: null }));
      if (!(await guetter(function () { var e = ecran(); return e && /Statut de l'intervention/i.test(e.textContent) && e; }, 5000))) return null;
      var tete = figer(ecran());
      [].forEach.call(tete.querySelectorAll('div,span,a'), function (n) {
        if (/^(← ?Retour|🗑 ?Supprimer|↩ Annuler la facturation.*|↩ Revenir en arrière.*|Réglée sur place.*|💶 Envoyer en facturation.*)$/.test(n.textContent.trim())) n.remove();
      });
      box.appendChild(tete);
      var ONG = [['analyse', '💧 Analyse'], ['check', '☑️ Contrôles'], ['conf', '🛡️ Conformité'], ['ms', '🚿 Mise en service'], ['oc', '📌 Obligation client'], ['cr', '📋 Compte rendu'], ['histo', '🕓 Historique'], ['fact', '💶 Facturation']];
      for (var i = 0; i < ONG.length; i++) {
        L.setState({ crSousOnglet: ONG[i][0], crPanelOuvert: true });
        var titreOng = ONG[i][1];
        /* (13/11/2026) build 106 : chaque onglet a un bandeau de couleur (icône + titre) ; ancien en-tête gardé en secours */
        var nomOng = titreOng.replace(/^[^A-Za-zÀ-ÿ]+/, '');
        var bloc = await guetter(function () {
          var b = [].find.call(D.body.querySelectorAll('div'), function (d) {
            if (d.closest('#bw-cr-complet')) return false;
            var st = d.getAttribute('style') || '';
            if (!/text-transform: uppercase/.test(st) || !/letter-spacing: 1px/.test(st)) return false;
            var x = d.textContent.trim();
            return x.length < 40 && x.slice(-nomOng.length) === nomOng && d.parentElement && d.parentElement.parentElement;
          });
          if (b) return b.parentElement.parentElement;
          var tl = [].find.call(D.body.querySelectorAll('span'), function (e) {
            if (e.children.length || e.textContent.trim() !== titreOng) return false;
            var g = e.parentElement && e.parentElement.parentElement; if (!g) return false;
            var x = g.innerText.trim();
            return x.length < 40 && x === x.toUpperCase();
          });
          return tl && tl.parentElement.parentElement.parentElement;
        }, 2000);
        if (!bloc) continue;
        await pause();
        var cl = figer(bloc);
        cl.style.cssText = 'background:#fff;border:1px solid #E3ECF5;border-radius:16px;padding:22px 26px;margin-top:16px';
        /* pied de l'écran (bandeau « clôturée », total, « déjà facturé », case « réglée sur place ») : montré une seule fois, en haut */
        [].forEach.call(cl.querySelectorAll('div'), function (c) { var x = c.textContent.trim(); if (x.length < 300 && /^(✓ Intervention terminée|Total estimé|✓ Déjà facturé|Réglée sur place|[＋+] ?Ajouter)/.test(x)) c.style.display = 'none'; });
        box.appendChild(cl);
      }
      L.setState({ crPanelOuvert: false, crSousOnglet: null });
      box.id = 'bw-cr-complet';
      box.style.cssText = 'position:absolute;left:0;top:0;width:760px;background:#fff;pointer-events:none';
      D.body.appendChild(box);
      return box;
    }
    /* fabrique la copie d'un document à partir de l'application cachée ; une seule fabrication à la fois (file d'attente) */
    var CACHE = {}, file = Promise.resolve();
    function fabriquer(doc) { var p = file.then(function () { return fabriquer1(doc); }); file = p.catch(function () {}); return p; }
    async function appPrete() {
      chargerApp();
      var L = await guetter(function () {
        var l = logique();
        try { var SB = app.contentWindow.BWSupabase; if (l && SB && SB.ready && !(l.state.clientsList || []).length && Date.now() - (appPrete.relu || 0) > 8000) { appPrete.relu = Date.now(); SB.pullAll(); } } catch (e) {}
        return l && (l.state.facturesList || []).length && (l.state.clientsList || []).length && app.contentWindow.document.body.classList.contains('bw-splash-fini') && l;
      }, 60000);
      return L;
    }
    async function fabriquer1(doc) {
      var L = await appPrete();
      if (!L) return { erreur: 'Document indisponible', msg: 'L’application ne s’est pas chargée (connexion ?).' };
      var S = L.state, W = app.contentWindow, id = '', titre = '', crBloc = null;
      var RAZ = { factureApercu: null, devisApercu: null, crApercuId: null, bilanCptOuvert: false, crPanelOuvert: false, histoDetailId: null, clientId: null };
      var avec = function (o) { var x = {}, a; for (a in RAZ) x[a] = RAZ[a]; for (a in o) x[a] = o[a]; return x; };
      var parNum = function (l) { return (l || []).slice().sort(function (a, b) { return String(b.num || '').localeCompare(String(a.num || '')); }); };
      var nomCli = function (id) { return ((S.clientsList || []).find(function (c) { return c.id === id; }) || {}).nom || ''; };
      var dernierRdv = function () { return (S.rdvs || []).filter(function (x) { return /termin/i.test(x.statut || ''); }).sort(function (a, b) { return String(b.date || '').localeCompare(String(a.date || '')); })[0]; };
      if (doc === 'facture') { var f = parNum(S.facturesList)[0]; L.setState(avec({ screen: 'factures', factureApercu: f.id, factureMode: 'visu' })); id = 'bw-sheet-facture'; titre = '🧾 Facture ' + f.num + ' — ' + nomCli(f.clientId); }
      else if (doc === 'devis') { var d = parNum(S.devisList)[0]; if (!d) return { erreur: 'Aucun devis', msg: '' }; L.setState(avec({ screen: 'devis', devisApercu: d.id, devisMode: 'visu' })); id = 'bw-sheet-devis'; titre = '📝 Devis ' + d.num + ' — ' + nomCli(d.clientId); }
      else if (doc === 'cr') {
        /* (12/11/2026) « le même onglet que dans l'application, avec tous les onglets à l'intérieur du compte rendu, comme quand
           je commence un RDV » : l'écran Comptes rendus du dernier RDV terminé (statut + tuiles), puis le contenu de CHAQUE onglet
           (Analyse, Contrôles, Conformité, Mise en service, Obligation client, Compte rendu, Historique, Facturation) à la suite. */
        var r = dernierRdv(); if (!r) return { erreur: 'Aucun compte rendu', msg: '' };
        titre = '📋 Compte rendu du ' + String(r.date || '').split('-').reverse().join('/') + ' — ' + (r.client || '');
        crBloc = await crComplet(L, W, r, avec);
        id = 'bw-cr-complet';
      }
      else if (doc === 'crclient') {
        /* (12/11/2026) « garde-moi ça aussi dans un autre onglet » : le compte rendu tel qu'il est envoyé au client (fiche client › historique) */
        var rc = dernierRdv(); if (!rc) return { erreur: 'Aucun compte rendu', msg: '' };
        var fc = (S.facturesList || []).find(function (x) { return x.num === rc.facture; });
        L.setState(avec({ screen: 'clients', clientId: rc.clientId, histoDetailId: rc.id, histoDetailFac: fc && fc.id })); id = 'bw-cr-histo';
        titre = '📨 Compte rendu client du ' + String(rc.date || '').split('-').reverse().join('/') + ' — ' + (rc.client || '');
      }
      else { L.setState(avec({ screen: 'compta', bilanCptOuvert: true })); id = 'bw-sheet-bilan-pro'; /* (12/11/2026) bilan unique depuis le build 104 */ titre = '📊 Bilan comptable ' + new Date().getFullYear(); }
      var el = await guetter(function () { var e = W.document.getElementById(id); return e && e.getBoundingClientRect().width > 0 && e; }, 6000);
      if (!el) return { erreur: esc(titre), msg: 'Document introuvable.' };
      /* hauteur stable deux fois de suite (le contenu a fini de s'afficher) */
      var hp = -1; for (var n = 0; n < 50; n++) { await pause(); var hh = el.scrollHeight; if (hh === hp && hh > 0) break; hp = hh; }
      /* (12/11/2026) « flou, pas assez visible, plus grand et mieux cadré » : plus d'image du PDF — le document lui-même
         (texte net à toute taille) est recopié sur une feuille blanche, agrandi raisonnablement (×1,4 au plus, 680 px de large au plus — « pas aussi gros »),
         sans boutons ni éléments de l'application. */
      var nat = Math.round(Math.max(el.scrollWidth, el.getBoundingClientRect().width));
      var cl = el.cloneNode(true);
      if (crBloc) crBloc.remove();
      [].forEach.call(cl.querySelectorAll('button,[data-bw-interne],input[type=file]'), function (n) { n.remove(); });
      [].forEach.call(cl.querySelectorAll('*'), function (n) {
        var st = n.style;
        if (st.position === 'sticky' || st.position === 'fixed') st.position = 'static';
        if (/auto|scroll/.test(st.overflowY)) st.overflowY = 'visible';
        if (st.maxHeight) st.maxHeight = 'none';
        if (!n.children.length && /^\s*[✕×]\s*$/.test(n.textContent)) n.remove();
      });
      ['maxHeight', 'overflow', 'borderRadius', 'boxShadow', 'margin', 'maxWidth', 'transform'].forEach(function (p) { cl.style[p] = { maxHeight: 'none', overflow: 'visible', borderRadius: '0', boxShadow: 'none', margin: '0', maxWidth: 'none', transform: 'none' }[p]; });
      cl.style.width = nat + 'px'; cl.style.position = 'static'; cl.style.pointerEvents = ''; cl.removeAttribute('id');
      var styles = [].map.call(W.document.querySelectorAll('style'), function (s) { return s.outerHTML; }).join('');
      var res = { titre: titre, html: cl.outerHTML, nat: nat, styles: styles, classe: W.document.documentElement.className };
      CACHE[doc] = res;
      return res;
    }
    /* affiche une feuille déjà fabriquée : invisible le temps de mesurer sa hauteur, puis d'un coup à sa taille finale
       (« à chaque clic l'aperçu zoome et revient à la normale ») */
    async function afficher(res, t) {
      if (res.erreur) { cadre(res.erreur, '<div style="color:#fff">' + esc(res.msg) + '</div>'); return; }
      cadre(esc(res.titre), '');
      var zone0 = papier.firstChild;
      var Z = document.createElement('div'); Z.id = 'pZ'; Z.style.cssText = 'width:100%;max-width:680px;display:flex;justify-content:center;position:relative';
      zone0.appendChild(Z);
      var fr = document.createElement('iframe');
      fr.title = res.titre; fr.style.cssText = 'border:0;background:#fff;display:block;box-shadow:0 8px 30px rgba(0,0,0,.4);border-radius:4px;visibility:hidden;pointer-events:none';
      Z.appendChild(fr);
      var largeur = Math.min(680, Z.clientWidth || 680, Math.round(res.nat * 1.4)), k = largeur / res.nat; fr.style.width = largeur + 'px'; Z.style.maxWidth = largeur + 'px';
      var d = fr.contentDocument; d.open();
      d.write('<!doctype html><html class="' + res.classe + '"><head><meta charset="utf-8">' + res.styles +
        '<style>html,body{margin:0;background:#fff;overflow:hidden;font-family:"Public Sans",sans-serif;color:#14265C}#p{zoom:' + k + ';width:' + res.nat + 'px}</style></head>' +
        '<body class="bw-pret bw-splash-fini"><div id="p">' + res.html + '</div></body></html>');
      d.close();
      /* (13/11/2026) « je n'arrive pas à monter et descendre quand la souris est sur les documents » puis « plus fluide » :
         la feuille (lecture seule) laisse passer la souris et le doigt — c'est la page des aperçus qui défile, avec le
         défilement natif et fluide du navigateur */
      var hPrec = -1;
      for (var h = 0; h < 40; h++) {
        await pause(); if (t !== tour) return;
        var H = Math.ceil(d.getElementById('p').getBoundingClientRect().height);
        if (H === hPrec && H > 0) break; hPrec = H;
      }
      fr.style.height = hPrec + 'px'; fr.style.visibility = 'visible';
      try { d.fonts.ready.then(function () { var H2 = Math.ceil(d.getElementById('p').getBoundingClientRect().height); if (H2 > 0) fr.style.height = H2 + 'px'; }); } catch (e) {}
    }
    async function surPapier(doc) {
      var t = ++tour;
      if (CACHE[doc]) {
        await afficher(CACHE[doc], t);
        /* remise à jour discrète : la feuille n'est remplacée que si le document a changé */
        var avant = CACHE[doc].html;
        fabriquer(doc).then(function (res) { if (t === tour && res && !res.erreur && res.html !== avant) afficher(res, t); });
        return;
      }
      cadre('Préparation du document…', '<div id="pAtt" style="color:#fff;font-size:14px;opacity:.85;margin-top:40px">Le document est fabriqué à partir de vos vraies données (lecture seule).</div>');
      var res = await fabriquer(doc);
      if (t !== tour) return;
      await afficher(res, t);
    }
    /* préparation à l'avance de tous les documents dès que l'application cachée est prête */
    setTimeout(function () { ['facture', 'devis', 'cr', 'crclient', 'bilan'].forEach(function (k) { fabriquer(k); }); }, 1500);
    function ouvrir(b) {
      boutons.forEach(function (x) { x.setAttribute('aria-current', x === b ? 'true' : 'false'); });
      zone.className = b.getAttribute('data-tel') === '1' ? 'tel' : '';
      var src = b.getAttribute('data-src'), doc = b.getAttribute('data-doc');
      if (doc) { surPapier(doc); }
      else {
        tour++; papier.style.display = 'none';
        vue.src = src;
      }
      try { localStorage.setItem('bw-apercu-page', src + (doc ? '#' + doc : '')); } catch (e) {}
    }
    boutons.forEach(function (b) { b.addEventListener('click', function () { ouvrir(b); }); });
    var der = null; try { der = localStorage.getItem('bw-apercu-page'); } catch (e) {}
    var depart = Array.prototype.find.call(boutons, function (b) { return b.getAttribute('data-src') + (b.getAttribute('data-doc') ? '#' + b.getAttribute('data-doc') : '') === der; }) || boutons[0];
    ouvrir(depart);
  })();
</script>
</body>
