<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>BlueWavea</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#ffffff">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<link rel="icon" href="bwicon-192.png">
<script>
  /* Redirection selon l'appareil : téléphone vers l'app mobile, sinon vers l'app bureau.
     Exception : fin de connexion Gmail (?bwGmail=) → message lisible, puis la fenêtre se referme. */
  (function () {
    var q = new URLSearchParams(location.search);
    if (q.has('bwGmail')) {
      var ok = q.get('bwGmail') === '1';
      try { if (window.opener) window.opener.postMessage({ bwGmail: ok }, '*'); } catch (e) {}
      document.addEventListener('DOMContentLoaded', function () {
        document.body.innerHTML =
          '<div style="max-width:340px;text-align:center;background:#fff;border-radius:18px;padding:28px 24px;box-shadow:0 6px 24px rgba(20,38,92,.12)">' +
          '<div style="font-size:34px">' + (ok ? '✅' : '⚠️') + '</div>' +
          '<div style="font-size:17px;font-weight:800;margin-top:10px"></div>' +
          '<div style="font-size:13px;color:#5B6B94;line-height:1.6;margin-top:8px"></div></div>';
        document.body.style.background = '#EDF4F9';
        var d = document.body.querySelectorAll('div div');
        d[1].textContent = q.get('titre') || '';
        d[2].textContent = q.get('texte') || '';
      });
      setTimeout(function () { try { window.close(); } catch (e) {} }, ok ? 1500 : 8000);
      return;
    }
    var mobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
    location.replace(mobile ? 'mobile/' : 'pc/');
  })();
</script>
</head>
<body style="margin:0;font-family:system-ui,sans-serif;background:#ffffff;color:#14265C;display:flex;align-items:center;justify-content:center;height:100vh">
  <div style="text-align:center">
    <div style="font-size:20px;font-weight:800;margin-bottom:14px">BlueWavea</div>
    <div style="display:flex;gap:12px;justify-content:center">
      <a href="pc/" style="background:#14265C;color:#fff;text-decoration:none;padding:12px 22px;border-radius:12px;font-weight:700">Version PC</a>
      <a href="mobile/" style="background:#2F7DD1;color:#fff;text-decoration:none;padding:12px 22px;border-radius:12px;font-weight:700">Version mobile</a>
    </div>
  </div>
</body>
</html>
