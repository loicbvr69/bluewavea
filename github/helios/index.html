  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ent extends DCLogic {\n  state = { parole: 'Je lis tes données…', question: '', saisie: '', mob: true, pc: true, ecoute: true, mode: 'repos', data: null, appui: 0 };\n\n  componentDidMount() {\n    try { localStorage.removeItem('helios-gemini-cle'); localStorage.removeItem('helios-gemini-voix'); } catch (e) {}\n    this.charger(); this.chargerVoix();\n    this._vis = () => { if (document.hidden) this.couperMicro(); else this.reprendreMicro(); };\n    document.addEventListener('visibilitychange', this._vis);\n    window.addEventListener('pagehide', () => this.couperMicro());\n    this._minute = setInterval(() => { if (!document.hidden) this.charger(true); }, 30000); /* temps réel : relu toutes les 30 s */\n    /* (06/11/2026, build 99) « le micro seulement quand Hélios est ouvert » : plus d'écoute au lancement de l'application.\n       Le micro s'allume quand Hélios est ouvert (réveillé), s'éteint à la mise en veille, à la fermeture de l'application\n       ou au verrouillage, et n'est jamais demandé si « Voix d'Hélios » est désactivée (Paramètres › Préférences).\n       Remplace le choix 1 du 02/11/2026 (écoute du mot « Hélios » dès l'ouverture). Le navigateur exige un premier\n       clic / toucher avant le son (et, sur iPhone, avant le micro) : l'écoute est aussi relancée à ce premier geste. */\n    setTimeout(() => this.majMicro(), 0);\n    this._premierGeste = () => { document.removeEventListener('pointerdown', this._premierGeste, true); document.removeEventListener('keydown', this._premierGeste, true);\n      try { const C = window.AudioContext || window.webkitAudioContext; if (!this._ctx && C) this._ctx = new C(); if (this._ctx && this._ctx.state === 'suspended') this._ctx.resume(); } catch (e) {}\n      this.demarrerVeille(); };\n    document.addEventListener('pointerdown', this._premierGeste, true); document.addEventListener('keydown', this._premierGeste, true);\n    /* (02/11/2026) mode application (chargé par bw-helios.js) : démarre en veille (micro éteint depuis le build 99), s'ouvre\n       ou se met en veille à la demande de l'application, et lui annonce son état */\n    const app = new URLSearchParams(location.search).get('app');\n    if (app === 'pc' || app === 'mobile') {\n      this._app = app; this._barre = parseInt(new URLSearchParams(location.search).get('barre'), 10) || 0;\n      this.setState({ appMode: app, pc: false, mob: false });\n      this._msg = (e) => { const d = e.data || {}; const v = this.renderVals();\n        if (d.helios === 'reveil') { if (app === 'pc' && !this.state.pc) v.basculerPc(); if (app === 'mobile' && !this.state.mob) { this.setState({ mob: true }); setTimeout(() => this.suggerer(), 5000); } }\n        if (d.helios === 'veille') { if (app === 'pc' && this.state.pc) v.basculerPc(); if (app === 'mobile' && this.state.mob) v.fermerMob(); }\n        if (d.helios === 'couper') this.couperMicro();\n        if (d.helios === 'reprendre') this.reprendreMicro();\n        if (d.helios === 'voix') { try { localStorage.setItem('bw-voix-helios', d.actif ? '1' : '0'); } catch (x) {} this.majMicro(); }\n        setTimeout(() => this.annoncer(), 0); };\n      window.addEventListener('message', this._msg);\n      this._annonceT = setInterval(() => { this.annoncer(); this.majMicro(); }, 250);\n    }\n  }\n  /* annonce à l'application son état (affiché / en veille, parle / écoute) — vérifié 4 fois par seconde, envoyé s'il change */\n  setState(m, cb) { super.setState(m, () => { this.annoncer(); this.majMicro(); if (cb) cb(); }); } /* chaque changement d'état est annoncé aussitôt */\n  /* (06/11/2026, build 99) micro autorisé seulement si « Voix d'Hélios » est activée et, dans l'application, si Hélios est\n     ouvert (réveillé). Réglage par appareil (localStorage bw-voix-helios, '0' = désactivée), activé par défaut. */\n  voixCoupee() { try { return localStorage.getItem('bw-voix-helios') === '0'; } catch (e) { return false; } }\n  micAutorise() {\n    if (this.voixCoupee()) return false;\n    if (this._app) return !!(this._app === 'pc' ? this.state.pc : this.state.mob);\n    return true;\n  }\n  /* allume l'écoute quand le micro devient autorisé, l'éteint aussitôt quand il ne l'est plus */\n  majMicro() {\n    const ok = this.micAutorise() && !this._coupe;\n    if (ok === this._micOk) return;\n    this._micOk = ok;\n    if (ok) { if (this.state.ecoute && this.state.mode !== 'parle') setTimeout(() => this.demarrerVeille(), 300); }\n    else this.eteindreMicro();\n  }\n  eteindreMicro() {\n    const v = this._veille; this._veille = null; if (v) { try { v.onend = null; v.abort(); } catch (e) {} }\n    const q = this._rq; this._rq = null; if (q) { try { q.onend = null; q.abort(); } catch (e) {} }\n    this.arreterCoupure(); clearTimeout(this._apresT); this._apres = null;\n    if (this.state.mode === 'ecoute' || this.state.mode === 'veille') this.setState({ mode: 'repos' });\n  }\n  annoncer() {\n    if (!this._app || window.parent === window) return;\n    const vis = !!(this._app === 'pc' ? this.state.pc : this.state.mob), cle = vis + '|' + this.state.mode;\n    if (cle === this._annonce) return;\n    this._annonce = cle;\n    try { window.parent.postMessage({ helios: 'etat', visible: vis, mode: this.state.mode }, '*'); } catch (e) {}\n  }\n  componentWillUnmount() {\n    clearInterval(this._minute); clearInterval(this._appuiT); if (this._raf) cancelAnimationFrame(this._raf);\n    this._jeton = (this._jeton || 0) + 1; this.stopAudio(); this.arreterEcoute();\n    if (this._premierGeste) { document.removeEventListener('pointerdown', this._premierGeste, true); document.removeEventListener('keydown', this._premierGeste, true); }\n    if (this._msg) window.removeEventListener('message', this._msg); clearInterval(this._annonceT);\n    try { speechSynthesis.cancel(); } catch (e) {} try { this._ctx && this._ctx.close(); } catch (e) {}\n  }\n\n  async charger(silencieux) {\n    const U = 'https://tmxkgxehlvrzjrbxqrpl.supabase.co/rest/v1/', K = 'sb_publishable_2igJPclD1o50Y-r8uI5Ebw_JMEvAlk-';\n    /* (04/11/2026) aperçu claude.ai (connexions extérieures bloquées) : Hélios lit la même copie du cloud que les\n       applications (bw-apercu-donnees.js), en lecture seule. Sur GitHub et bluewavea.fr, rien ne change. */\n    const apercu = /^https?:$/.test(location.protocol || '') && !/(^|\\.)github\\.io$|(^|\\.)bluewavea\\.fr$|^localhost$|^127\\./.test(location.hostname || '');\n    const copie = () => window.BW_APERCU_DONNEES ? Promise.resolve(window.BW_APERCU_DONNEES) : (this._copieP = this._copieP || new Promise((ok) => {\n      const s = document.createElement('script'); s.src = 'bw-apercu-donnees.js';\n      s.onload = () => ok(window.BW_APERCU_DONNEES || null); s.onerror = () => { this._copieP = null; ok(null); }; document.head.appendChild(s); }));\n    /* même réponse que le cloud : « nom:data->>cle » = texte, « nom:data->cle » = valeur brute, filtre « id=eq.… » */\n    const lireCopie = async (q) => {\n      const d = await copie(); if (!d || !d.tables) throw new Error('copie');\n      const [tab, qs] = q.split('?'); const p = new URLSearchParams(qs || '');\n      const champs = String(p.get('select') || '*').split(',');\n      const filtre = p.get('id'); const vid = filtre && filtre.indexOf('eq.') === 0 ? filtre.slice(3) : null;\n      const texte = (v) => v == null ? null : (typeof v === 'object' ? JSON.stringify(v) : String(v));\n      return (d.tables[tab] || []).filter(r => vid == null || String(r.id) === vid).map(r => {\n        const o = {};\n        champs.forEach(c => {\n          const m = /^(?:(\\w+):)?data(->>|->)(\\w+)$/.exec(c);\n          if (m) { const v = (r.data || {})[m[3]]; o[m[1] || m[3]] = m[2] === '->>' ? texte(v) : (v === undefined ? null : v); }\n          else if (c === '*') Object.assign(o, r); else o[c] = r[c] === undefined ? null : r[c];\n        });\n        return o;\n      });\n    };\n    /* (05/11/2026) sécurité : Hélios lit le cloud avec la connexion BlueWavea de l'appareil (même session que les\n       applications PC / mobile, renouvelée ici si elle a expiré) ; sans connexion, le cloud ne répond plus rien */\n    const jeton = async () => {\n      /* dans l'application PC / mobile : attendre la connexion de l'appareil, puis prendre son jeton */\n      let B = window.BWSupabase; try { if (!B && window.parent !== window) B = window.parent.BWSupabase; } catch (e) {}\n      if (B && B.jetonSession && !B.estApercu) {\n        for (let i = 0; i < 600 && !B.ready; i++) await new Promise((ok) => setTimeout(ok, 500));\n        const t = await B.jetonSession(); if (t) return t;\n      }\n      const CLE = 'sb-tmxkgxehlvrzjrbxqrpl-auth-token';\n      let s = null; try { s = JSON.parse(localStorage.getItem(CLE) || 'null'); } catch (e) {}\n      if (!s || !s.access_token) return null;\n      if (!s.expires_at || s.expires_at * 1000 > Date.now() + 60000 || !s.refresh_token) return s.access_token;\n      try {\n        const r = await fetch(U.replace('/rest/v1/', '/auth/v1/') + 'token?grant_type=refresh_token', { method: 'POST',\n          headers: { apikey: K, 'content-type': 'application/json' }, body: JSON.stringify({ refresh_token: s.refresh_token }) });\n        if (!r.ok) return s.access_token;\n        const j = await r.json();\n        const n = Object.assign({}, s, j, { expires_at: Math.floor(Date.now() / 1000) + (j.expires_in || 3600) });\n        try { localStorage.setItem(CLE, JSON.stringify(n)); } catch (e) {}\n        return n.access_token;\n      } catch (e) { return s.access_token; }\n    };\n    const lire = apercu ? lireCopie : async (q) => { const t = await jeton(); const r = await fetch(U + q, { headers: { apikey: K, authorization: 'Bearer ' + (t || K) } }); if (!r.ok) throw new Error(r.status); return r.json(); };\n    try {\n      /* (01/11/2026) alertes publiées par l'application (reglages « alertes », mêmes titres que « À traiter ») */\n      /* (01/11/2026) données publiées par l'application pour Hélios (reglages « helios », telles qu'elle les calcule) */\n      lire('reglages?select=data&id=eq.helios').then(a => { const v = a[0] && a[0].data; this.setState({ heliosApp: v || null }); }).catch(() => {});\n      if (!this._memLu) lire('reglages?select=data&id=eq.helios_memoire').then(a => { const v = a[0] && a[0].data; if (v) this.memFusion(v); this._memLu = true; }).catch(() => {});\n      lire('reglages?select=data&id=eq.alertes').then(a => { const v = a[0] && a[0].data; this.setState({ alertesApp: v && Array.isArray(v.liste) ? v : null }); }).catch(() => {});\n      const [cl, fa, rd, si] = await Promise.all([\n        lire('clients?select=id,nom:data->>nom,civ:data->>civilite,tel:data->>tel,tel2:data->>tel2,ville:data->>ville,cp:data->>cp,adr:data->>adresse,mail:data->>email,ct:data->>contratType,ty:data->>type,code:data->>code,signe:data->>contratSigneLe,avis:data->>avisDemande,cree:data->>dateCreation,appareil:data->>appareil,del:data->>_deleted'),\n        lire('factures?select=id,num:data->>num,statut:data->>statut,total:data->>total,clientId:data->>clientId,emis:data->>dateEmission,pieces:data->pieces,cra:data->crAnalyse,cr:data->>compteRendu,design:data->>design,pay:data->>paiement,chq:data->>chequeNum,payd:data->>paiementDetail,del:data->>_deleted'),\n        lire('rdvs?select=id,date:data->>date,heure:data->>heure,client:data->>client,del:data->>_deleted'),\n        lire('signatures?select=id,nom:data->>clientNom,type:data->>type,envoye:data->>envoyeLe,ouvert:data->>ouvertLe,signe:data->>signeLe,del:data->>_deleted')\n      ]);\n      const vivant = (x) => x.del !== 'true';\n      const clients = cl.filter(vivant), noms = {};\n      clients.forEach(c => { noms[String(c.id)] = c.nom; });\n      this._noms = clients.map(c => c.nom).concat(si.map(s => s.nom), rd.map(r => r.client));\n      const num = (t) => typeof t === 'number' ? t : (parseFloat(String(t || '').replace(/[^\\d,.-]/g, '').replace(/\\./g, '').replace(',', '.')) || 0);\n      const cle = (n) => { const m = /(\\d{4})-(\\d+)/.exec(n || ''); return m ? (+m[1]) * 10000 + (+m[2]) : 0; };\n      const jours = (d) => { const m = /^(\\d{2})[\\/.](\\d{2})[\\/.](\\d{4})/.exec(d || ''); if (!m) return null; return Math.floor((Date.now() - new Date(+m[3], +m[2] - 1, +m[1]).getTime()) / 86400000); };\n      const impayes = fa.filter(vivant).filter(f => f.statut && f.statut !== 'Payée').sort((a, b) => cle(b.num) - cle(a.num))\n        .map(f => ({ num: f.num, nom: noms[String(f.clientId)] || '—', montant: num(f.total), age: jours(f.emis), retard: f.statut === 'En retard' }));\n      /* (01/11/2026) « rien de faux » : « en retard » = statut posé par l'application, jamais recalculé ici */\n      const auj = new Date(); auj.setHours(0, 0, 0, 0);\n      const rdvs = rd.filter(vivant).filter(r => r.date && new Date(r.date) >= auj).sort((a, b) => (a.date + (a.heure || '')).localeCompare(b.date + (b.heure || '')));\n      const attSig = si.filter(vivant).filter(s => s.envoye && !s.signe);\n      this._clients = clients;\n      /* (01/11/2026) audit en continu : uniquement des constats vérifiables sur les données, jamais corrigés par Hélios */\n      const audit = [];\n      fa.filter(vivant).forEach(f => {\n        if (f.statut === 'Payée' && !String(f.pay || '').trim()) audit.push({ t1: (f.num || '—') + ' · ' + (noms[String(f.clientId)] || '—'), t2: 'Facture payée sans mode de règlement' });\n        if (/ch[eè]que|carte/i.test(String(f.pay || '')) && !String(f.chq || '').trim() && !/\\d{3,}/.test(String(f.payd || ''))) audit.push({ t1: (f.num || '—') + ' · ' + (noms[String(f.clientId)] || '—'), t2: 'Règlement par chèque ou carte sans numéro' });\n      });\n      clients.filter(c => !String(c.tel || '').trim() && !String(c.tel2 || '').trim()).forEach(c => audit.push({ t1: c.nom || '—', t2: 'Fiche client sans téléphone' }));\n      const vus = {}; clients.forEach(c => { const k = String(c.nom || '').trim().toLowerCase(); if (!k) return; if (vus[k] === 1) audit.push({ t1: c.nom, t2: 'Deux fiches clients portent ce nom e de client prononcé à voix haute (affichés seulement à l'écran) */\n  pourVoix(texte) {\n    let t = texte;\n    (this._noms || []).filter(n => n && n.length > 2).sort((a, b) => b.length - a.length).forEach(n => { t = t.split(n).join('un client'); });\n    /* (01/11/2026) à l'oral seulement : « 520,00 € » se dit « 520 € » ; les centimes ne sont dits que s'il y en a\n       (l'écran garde toujours le montant au centime près) */\n    t = t.replace(/(\\d)[,.]00(\\s?(€|euros?))/gi, '$1$2');\n    t = t.replace(/0[67](\\s?\\d{2}){4}/g, '').replace(/\\S+@\\S+/g, '');\n    /* (02/11/2026) « il est suisse, mais quand il dit 90 ou 70 qu'il le dise en français » : tout nombre est écrit en\n       toutes lettres à la française (soixante-dix, quatre-vingts, quatre-vingt-dix…), jamais septante / huitante / nonante.\n       Montants à centimes : « 390,50 € » → « trois cent quatre-vingt-dix euros cinquante ». Dates et numéros\n       (F-2026-013, 09/11/2026, 20:53) gardent leurs chiffres, lus chiffre par groupe. */\n    t = t.replace(/(\\d[\\d\\u202f\\u00a0 ]*)[,.](\\d{2})\\s?(€|euros?)/gi, (m, e, c) => this.enLettres(e.replace(/\\D/g, '')) + ' euros ' + this.enLettres(c));\n    t = t.replace(/(\\d[\\d\\u202f\\u00a0]*)\\s?(€|euros?)/gi, (m, e) => this.enLettres(e.replace(/\\D/g, '')) + ' euros');\n    t = t.replace(/(^|[^\\d\\/:\\-])(\\d{1,9})(?![\\d\\/:\\-])/g, (m, a, n) => a + this.enLettres(n));\n    return t.replace(/•/g, '').replace(/—/g, ',');\n  }\n  enLettres(s) {\n    let n = parseInt(s, 10); if (isNaN(n)) return s; if (n === 0) return 'zéro';\n    const U = ['', 'un', 'deux', 'trois', 'quatre', 'cinq', 'six', 'sept', 'huit', 'neuf', 'dix', 'onze', 'douze', 'treize', 'quatorze', 'quinze', 'seize', 'dix-sept', 'dix-huit', 'dix-neuf'];\n    const D = ['', '', 'vingt', 'trente', 'quarante', 'cinquante', 'soixante'];\n    const cent99 = (x) => {\n      if (x < 20) return U[x];\n      const d = Math.floor(x / 10), u = x % 10;\n      if (d === 7 || d === 9) { const b = d === 7
